[project]
name = "recompete"
version = "0.1.0"
description = "The FY27 recompete cliff: which expiring federal contracts will change hands, and can a model tell?"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Jason Pellerin", email = "jason@jasonpellerin.com" }]
license = { text = "MIT" }
dependencies = [
    "duckdb>=1.5.6",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "shap>=0.52.0",
    "streamlit>=1.64.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyterlab>=4.6.4",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recompete"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # line length is owned by ruff format; long SQL and log strings stay whole

[tool.pytest.ini_options]
testpaths = ["tests"]
